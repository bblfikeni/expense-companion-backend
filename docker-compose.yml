name: sars-companion

# Credentials come from environment variables — copy .env.example to .env first.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set - copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is not set - copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is not set - copy .env.example to .env}
    ports:
      # Host ports are overridable so this stack can coexist with other local
      # RabbitMQ instances; the container ports stay fixed.
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:2026.1.17182
    environment:
      ACCEPT_EULA: "Y"
      # Local dev only: skip the first-run admin login.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # Container port 80 serves the UI and API and also accepts ingestion;
      # container port 5341 is ingestion-only.
      - "5341:80"
    volumes:
      - seq-data:/datavolumes

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Services/Companion.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__CompanionDb: ${COMPANION_API_DB:-}
      RabbitMq__ConnectionString: &local-rabbitmq "host=rabbitmq;username=${RABBITMQ_USER};password=${RABBITMQ_PASSWORD}"
      Auth__Jwt__SigningKey: ${COMPANION_JWT_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:${COMPANION_API_PORT:-8080}:8080"

  extraction:
    profiles: [app]
    init: true
    build:
      context: .
      dockerfile: Services/Companion.Extraction/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Local testing only: set Extraction__Enabled to "true" in a separate
      # Compose override after applying migrations and provisioning the extraction role.
      Extraction__Enabled: "false"
      ConnectionStrings__ExtractionDb: ${COMPANION_EXTRACTION_DB:-}
      RabbitMq__ConnectionString: *local-rabbitmq

volumes:
  postgres-data:
  rabbitmq-data:
  seq-data:
