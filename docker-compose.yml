name: sars-companion

# Local infrastructure only. Application services are not containerised yet.
# Credentials come from environment variables — copy .env.example to .env first.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set - copy .env.example to .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is not set - copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is not set - copy .env.example to .env}
    ports:
      # Host ports are overridable so this stack can coexist with other local
      # RabbitMQ instances; the container ports stay fixed.
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:2026.1.17182
    environment:
      ACCEPT_EULA: "Y"
      # Local dev only: skip the first-run admin login.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # Container port 80 serves the UI and API and also accepts ingestion;
      # container port 5341 is ingestion-only.
      - "5341:80"
    volumes:
      - seq-data:/datavolumes

volumes:
  postgres-data:
  rabbitmq-data:
  seq-data:
